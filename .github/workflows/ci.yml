name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libegl1

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile translations
        run: uv run pybabel compile -d src/i18n/locales

      - name: Run linter
        run: uv run ruff check src/ tests/

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest tests/ -v --tb=short

      - name: Minimize uv cache
        run: uv cache prune --ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install linting tools
        run: uv pip install ruff

      - name: Check formatting with ruff
        run: uv run ruff format --check src/ tests/

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run mypy
        run: uv run mypy src/ --python-version 3.12 --ignore-missing-imports --no-error-summary || true

  # Validate packaging configuration files
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --frozen
          uv pip install pyinstaller

      - name: Validate PyInstaller spec files
        run: |
          echo "=== Validating tunecover.spec ==="
          uv run python -c "
          import sys
          sys.path.insert(0, '.')
          # Mock PyInstaller globals that are injected at runtime
          class MockClass:
              def __init__(self, *args, **kwargs): pass
          for name in ['Analysis', 'PYZ', 'EXE', 'COLLECT', 'BUNDLE']:
              globals()[name] = MockClass
          exec(open('packaging/tunecover.spec').read())
          print('tunecover.spec: OK')
          "

          echo "=== Validating tunecover-macos.spec ==="
          uv run python -c "
          import sys
          sys.path.insert(0, '.')
          class MockClass:
              def __init__(self, *args, **kwargs): pass
          for name in ['Analysis', 'PYZ', 'EXE', 'COLLECT', 'BUNDLE']:
              globals()[name] = MockClass
          exec(open('packaging/tunecover-macos.spec').read())
          print('tunecover-macos.spec: OK')
          "

      - name: Validate Flatpak manifest
        run: |
          uv run python -c "
          import yaml
          with open('flatpak/io.github.comxd.TuneCover.yml') as f:
              manifest = yaml.safe_load(f)
          assert manifest['app-id'] == 'io.github.comxd.TuneCover'
          assert 'modules' in manifest
          print('Flatpak manifest: OK')
          "

      - name: Validate shell scripts
        run: |
          bash -n packaging/generate-icons.sh
          echo "generate-icons.sh: OK"
          bash -n packaging/generate-macos-icns.sh
          echo "generate-macos-icns.sh: OK"
