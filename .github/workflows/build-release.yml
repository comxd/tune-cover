name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # Manual trigger builds all platforms without creating a release.
    # Release is only created on tag push (see create-release job condition).

# Default: no permissions. Grant only what's needed per-job.
permissions: {}

jobs:
  # ===========================================================================
  # Linux: Flatpak build
  # ===========================================================================
  build-linux-flatpak:
    runs-on: ubuntu-latest
    container:
      # Pre-built image with KDE SDK - no need to install Flathub/SDK manually.
      # Update tag when runtime-version changes in flatpak/io.github.comxd.TuneCover.yml
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.9
      options: --privileged
    steps:
      # All actions pinned to SHA for security (supply chain protection)
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: flatpak/flatpak-github-actions/flatpak-builder@20eb46c470bdf05a29dc2262108f497d2d79199b # v6
        with:
          bundle: TuneCover-linux.flatpak
          manifest-path: flatpak/io.github.comxd.TuneCover.yml
          cache-key: flatpak-builder-${{ hashFiles('flatpak/**') }}
          upload-artifact: false

      # Upload manually: the flatpak-builder action appends arch to the artifact
      # name with .flatpak extension, making download paths unpredictable.
      - name: Rename bundle for release
        run: mv TuneCover-linux.flatpak TuneCover-linux-x86_64.flatpak

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: TuneCover-linux-x86_64
          path: TuneCover-linux-x86_64.flatpak

  # ===========================================================================
  # Windows: PyInstaller build
  # ===========================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      # Download chromaprint for audio fingerprinting (verified by SHA-256)
      - name: Install Chromaprint
        shell: pwsh
        run: |
          $chromaprintUrl = "https://github.com/acoustid/chromaprint/releases/download/v1.6.0/chromaprint-fpcalc-1.6.0-windows-x86_64.zip"
          $expectedHash = "30179D3D0DC4CC92F1A0995C1A2E523FB4867724C2EE6A6CEAE474F8E4D6937A"
          Invoke-WebRequest -Uri $chromaprintUrl -OutFile chromaprint.zip
          $actualHash = (Get-FileHash chromaprint.zip -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            Write-Error "Checksum mismatch for chromaprint.zip: expected $expectedHash, got $actualHash"
            exit 1
          }
          Expand-Archive -Path chromaprint.zip -DestinationPath chromaprint
          Copy-Item chromaprint/chromaprint-fpcalc-1.6.0-windows-x86_64/fpcalc.exe -Destination packaging/

      - name: Compile translations
        run: uv run pybabel compile -d src/i18n/locales

      - name: Build with PyInstaller
        run: |
          cd packaging
          uv run pyinstaller tunecover.spec

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path packaging/dist/TuneCover -DestinationPath TuneCover-windows-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: TuneCover-windows
          path: TuneCover-windows-x86_64.zip

  # ===========================================================================
  # macOS: PyInstaller builds (Intel + Apple Silicon)
  # ===========================================================================
  build-macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: intel
            runner: macos-15-intel  # Last free Intel option, retiring Fall 2027
          - arch: arm
            runner: macos-latest    # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Install Chromaprint
        run: brew install chromaprint

      - name: Compile translations
        run: uv run pybabel compile -d src/i18n/locales

      - name: Generate macOS icon (ICNS)
        run: ./packaging/generate-macos-icons.sh

      - name: Build with PyInstaller
        run: |
          cd packaging
          uv run pyinstaller tunecover-macos.spec

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: TuneCover-macos-${{ matrix.arch }}-app
          path: packaging/dist/TuneCover.app
          retention-days: 1

  # ===========================================================================
  # macOS: Create Universal Binary from Intel + ARM builds
  # ===========================================================================
  build-macos-universal:
    needs: [build-macos]
    runs-on: macos-latest
    permissions:
      actions: write  # Required to delete intermediate artifacts
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download Intel app bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: TuneCover-macos-intel-app
          path: intel-app/TuneCover.app

      - name: Download ARM app bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: TuneCover-macos-arm-app
          path: arm-app/TuneCover.app

      - name: Create Universal Binary
        run: |
          echo "=== Creating Universal Binary ==="

          # Copy ARM app as base for the universal binary
          mkdir -p universal-app
          cp -R arm-app/TuneCover.app universal-app/TuneCover.app

          # Find all Mach-O binaries and merge with Intel counterparts
          find universal-app/TuneCover.app -type f | while read -r arm_file; do
            rel_path="${arm_file#universal-app/TuneCover.app/}"
            intel_file="intel-app/TuneCover.app/${rel_path}"

            [[ ! -f "$intel_file" ]] && continue

            if file "$arm_file" | grep -q "Mach-O"; then
              echo "Combining: $rel_path"
              lipo -create "$intel_file" "$arm_file" -output "${arm_file}.universal" 2>/dev/null || {
                echo "  Skipping (lipo failed): $rel_path"
                continue
              }
              mv "${arm_file}.universal" "$arm_file"
            fi
          done

          echo "=== Universal Binary created ==="

      - name: Verify Universal Binary
        run: |
          echo "Main executable architectures:"
          lipo -info universal-app/TuneCover.app/Contents/MacOS/TuneCover || echo "Could not check main executable"

          universal_count=$(find universal-app/TuneCover.app -type f -exec sh -c 'file "$1" | grep -q "universal binary"' _ {} \; -print | wc -l)
          echo "Universal binaries created: $universal_count"

      - name: Create Universal DMG
        run: |
          hdiutil create -volname "TuneCover" \
            -srcfolder universal-app/TuneCover.app \
            -ov -format UDZO \
            TuneCover-macos-universal.dmg

      - name: Upload Universal DMG
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: TuneCover-macos-universal
          path: TuneCover-macos-universal.dmg

      # Clean up intermediate arch-specific artifacts (only the universal DMG is distributed)
      - name: Delete intermediate macOS artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in TuneCover-macos-intel-app TuneCover-macos-arm-app; do
            artifact_id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq ".artifacts[] | select(.name == \"${name}\") | .id")
            if [[ -n "$artifact_id" ]]; then
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${artifact_id}"
              echo "Deleted artifact: ${name} (id: ${artifact_id})"
            fi
          done

  # ===========================================================================
  # Create GitHub Release (on tag push)
  # ===========================================================================
  create-release:
    needs: [build-linux-flatpak, build-windows, build-macos-universal]
    runs-on: ubuntu-latest
    # Only this job needs write permissions for creating releases
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download Flatpak artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: TuneCover-linux-x86_64
          path: artifacts/TuneCover-linux-x86_64

      - name: Download Windows artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: TuneCover-windows
          path: artifacts/TuneCover-windows

      - name: Download macOS Universal artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: TuneCover-macos-universal
          path: artifacts/TuneCover-macos-universal

      - name: List artifacts
        run: find artifacts -type f \( -name "*.flatpak" -o -name "*.zip" -o -name "*.dmg" \)

      - name: Create Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          name: TuneCover ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/TuneCover-linux-x86_64/TuneCover-linux-x86_64.flatpak
            artifacts/TuneCover-windows/TuneCover-windows-x86_64.zip
            artifacts/TuneCover-macos-universal/TuneCover-macos-universal.dmg
