[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tunecover"
version = "0.1.1"
description = "A GUI application for fetching and embedding album artwork in music libraries"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "David DIVERRES", email = "david@comexpertise.com"}
]
keywords = ["music", "album", "cover", "artwork", "musicbrainz", "tagger", "tunecover"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "PySide6>=6.8.0",
    "mutagen>=1.47.0",
    "requests>=2.32.0",
    "Pillow>=11.0.0",
    "PyYAML>=6.0.2",
    "music-metadata-filter>=2.0.0",
    "pyacoustid>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-qt>=4.4.0",
    "pytest-cov>=6.0.0",
    "responses>=0.25.8",  # HTTP mocking for tests
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pyrefly>=0.50.1",  # Type checker (Meta's Pyre replacement)
    "types-requests>=2.32.0",
    "pre-commit>=4.0.0",
    "Babel>=2.17.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
tunecover = "src.main:main"

[project.gui-scripts]
tunecover-gui = "src.main:main"

[project.urls]
Homepage = "https://github.com/comxd/tune-cover"
Repository = "https://github.com/comxd/tune-cover"
Issues = "https://github.com/comxd/tune-cover/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.i18n.locales" = ["*/LC_MESSAGES/*.mo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    # Ignore deprecation warnings from audioread (dependency of pyacoustid)
    # These modules are deprecated in Python 3.13 but still used by audioread
    "ignore:'aifc' is deprecated:DeprecationWarning",
    "ignore:'audioop' is deprecated:DeprecationWarning",
    "ignore:'sunau' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade (Python 3.12+ modernization)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit (security)
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "FURB",   # refurb (modernization)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # assert used (needed for tests)
    "S110",   # try-except-pass (sometimes necessary)
    "S311",   # pseudo-random generators (acceptable for non-crypto use)
    "S324",   # hashlib insecure (SHA256 is fine for file hashing)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # Allow asserts
    "S103",   # Allow chmod permissions
    "S105",   # Allow hardcoded passwords
    "S106",   # Allow hardcoded passwords
    "S108",   # Allow hardcoded temp paths
    "E741",   # Allow ambiguous variable names (l, O, I)
    "F401",   # Allow unused imports
    "F841",   # Allow unused variables
    "PTH101", # Allow os.chmod()
    "PTH116", # Allow os.stat()
    "PTH123", # Allow open() instead of Path.open()
    "RUF012", # Allow mutable class defaults
    "RUF013", # Allow implicit Optional
    "RUF015", # Allow list comprehension for first element
    "RUF059", # Allow unused unpacked variables
    "SIM102", # Allow nested if (readability in tests)
    "SIM108", # Allow if-else instead of ternary
    "SIM113", # Allow manual counter instead of enumerate
    "SIM117", # Allow nested with (common pattern with multiple mocks)
]
"src/main.py" = ["F401"]  # Intentional import checks for dependency verification
"src/cli/commands.py" = ["F841"]  # argparse subparser pattern

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/"]

# Note: [dependency-groups] (PEP 735) removed in favor of standard [project.optional-dependencies]
# This ensures compatibility with both `pip install -e ".[dev]"` and `uv sync`
