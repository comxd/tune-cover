# TuneCover Flatpak Manifest
#
# Architecture: x86_64 only (requires glibc 2.34+)
# Note: This manifest uses manylinux_2_34 x86_64 wheels for PySide6.
#       ARM64/aarch64 is not currently supported. Contributions welcome!
#
# Build: flatpak-builder --force-clean build-dir io.github.comxd.TuneCover.yml
# Test:  flatpak-builder --run build-dir io.github.comxd.TuneCover.yml tunecover
#
# Updating Python dependencies:
#   1. Update versions in flatpak/requirements-flatpak.txt
#   2. Run: uv run req2flatpak --requirements-file flatpak/requirements-flatpak.txt \
#           --target-platforms 312-x86_64 --yaml
#   3. Replace the python3-dependencies module sources with the output

app-id: io.github.comxd.TuneCover
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: tunecover

finish-args:
  # X11 + Wayland display
  - --share=ipc
  - --socket=x11
  - --socket=fallback-x11
  - --socket=wayland
  # OpenGL for Qt rendering
  - --device=dri
  # Network for API calls (MusicBrainz, Discogs, Last.fm)
  - --share=network
  # Full filesystem access for music files (users may have music anywhere)
  - --filesystem=host
  # App config directory (XDG compliant)
  - --filesystem=xdg-config/tunecover:create

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'

modules:
  # Chromaprint - audio fingerprinting library (required for pyacoustid)
  # Same approach as MusicBrainz Picard: https://github.com/flathub/org.musicbrainz.Picard
  - name: chromaprint
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE:STRING=Release
      - -DBUILD_TOOLS:BOOL=ON
      - -DBUILD_TESTS:BOOL=OFF
    sources:
      - type: archive
        url: https://github.com/acoustid/chromaprint/releases/download/v1.6.0/chromaprint-1.6.0.tar.gz
        sha256: 9d33482e56a1389a37a0d6742c376139fa43e3b8a63d29003222b93db2cb40da
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig

  # Python dependencies - generated with req2flatpak
  # To regenerate: uv run req2flatpak --requirements-file flatpak/requirements-flatpak.txt --target-platforms 312-x86_64 --yaml
  - name: python3-dependencies
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-build-isolation certifi charset-normalizer idna urllib3
        requests mutagen pillow pyyaml music-metadata-filter shiboken6 pyside6-essentials
        pyside6-addons pyside6 audioread pyacoustid
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/7e/16/fbe8e1e185a45042f7cd3a282def5bb8d95bb69ab9e9ef6a5368aa17e426/audioread-3.1.0-py3-none-any.whl
